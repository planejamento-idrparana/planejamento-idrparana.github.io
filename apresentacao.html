<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Apresentação do ecossistema · DEPLAN</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#2b373e;--muted:#5d6b73;--blue:#0163ad;--green:#007a47;--boia:#f26a21}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg,#10202a);transition:background .5s}
body{font:400 24px/1.4 Inter,system-ui,sans-serif;color:#fff}
h1,h2,h3{font-family:Montserrat,Inter,sans-serif;margin:0}

/* palco fixo em 16:9, escalado para a janela */
#stage{position:absolute;left:50%;top:50%;width:1600px;height:900px;margin:-450px 0 0 -800px;overflow:hidden;cursor:default}
.slide{position:absolute;inset:0;background:var(--c);visibility:hidden;padding:64px 80px 84px}
.slide.on{visibility:visible}

/* entrada dos elementos */
[data-a]{opacity:0;transition:opacity .6s,transform .8s cubic-bezier(.2,.8,.2,1);transition-delay:var(--d,0s)}
[data-a=up]{transform:translateY(56px)}
[data-a=left]{transform:translateX(-110px)}
[data-a=right]{transform:translateX(110px)}
[data-a=pop]{transform:scale(.72)}
[data-a].in{opacity:1;transform:none}

/* transição: as duas faixas inclinadas do logo varrem a tela */
#wipe{position:absolute;inset:0;z-index:30;pointer-events:none;overflow:hidden}
#wipe i{position:absolute;top:-10%;height:120%;width:70%;left:-90%;transform:skewX(-20deg)}
#wipe i:nth-child(1){background:var(--blue)}
#wipe i:nth-child(2){background:#009857;animation-delay:.08s}
#wipe.go i{animation:varre .85s cubic-bezier(.7,0,.3,1) both}
#wipe.go i:nth-child(2){animation-delay:.09s}
@keyframes varre{to{left:125%}}

.rule{display:flex;gap:8px;height:8px;width:190px}
.rule::before{content:"";flex:7;background:#fff;transform:skewX(-35deg)}
.rule::after{content:"";flex:3;background:var(--boia);transform:skewX(-35deg)}
.kick{font:700 22px/1.3 Montserrat,sans-serif;letter-spacing:.14em;text-transform:uppercase;opacity:.85}

/* quadrinho de abertura: começa no painel da fonte e abre para o mar */
.hq{position:absolute;left:0;top:30px;width:1600px;height:800px}
.hq img{display:block;width:100%;height:100%;clip-path:polygon(0 0,44.8% 0,42.8% 100%,0 100%);transform:translateX(452px);
  transition:clip-path 1.5s cubic-bezier(.7,0,.2,1),transform 1.5s cubic-bezier(.7,0,.2,1)}
[data-step="1"] .hq img{clip-path:polygon(0 0,100% 0,100% 100%,0 100%);transform:none}

/* vídeo em tela inteira: legendas ficam no rodapé, por isso a faixa do mar sai */
.filme{padding:0}
#filme{position:absolute;inset:0;width:100%;height:100%;background:#000}

/* ponte */
.ponte{display:flex;flex-direction:column;justify-content:center;height:100%;gap:42px;max-width:1300px}
.ponte p{margin:0;font:800 74px/1.12 Montserrat,sans-serif;letter-spacing:-.01em}
.ponte p em{font-style:normal;color:#ffc9a6}
.anel{position:absolute;right:90px;bottom:120px;width:300px;height:300px}

/* mapa */
.mapa{display:grid;grid-template-columns:560px 1fr;gap:30px;align-items:center;height:100%}
.mapa h2{font-size:82px;font-weight:900;line-height:1.04;letter-spacing:-.01em}
.mapa .n{font:900 150px/1 Montserrat,sans-serif;color:#ffc9a6;margin-top:40px}
.mapa .n small{display:block;font:500 28px/1.3 Inter,sans-serif;color:#fff;margin-top:8px}
.mapa svg{width:100%;height:auto;overflow:visible}
#contorno{fill:rgba(255,255,255,.1);stroke:#fff;stroke-width:2;stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset 1.6s ease-in-out}
.on #contorno{stroke-dashoffset:0}
.mun{fill:#fff;opacity:0;transform-box:fill-box;transform-origin:center}
.on .mun{animation:acende .5s ease-out forwards;animation-delay:var(--d)}
@keyframes acende{0%{opacity:0;transform:scale(0)}70%{opacity:1;transform:scale(2);fill:#ffc9a6}100%{opacity:.9;transform:none}}

/* visão geral */
.visao h2{font-size:64px;font-weight:900;margin:14px 0 34px}
.linha{display:grid;grid-template-columns:90px 1fr auto;align-items:center;gap:24px;width:100%;height:106px;margin-bottom:12px;padding:0 40px;
  border:0;border-radius:14px;background:var(--c2);color:#fff;font:inherit;text-align:left;cursor:pointer}
.linha:hover,.linha:focus-visible{outline:4px solid #fff}
.linha b{font:900 52px/1 Montserrat,sans-serif;opacity:.6}
.linha span{font:800 40px/1.1 Montserrat,sans-serif}
.linha i{font:500 26px/1 Inter,sans-serif}

/* capa de ambiente */
.capa{display:flex;flex-direction:column;justify-content:center;height:100%;max-width:1150px;position:relative;z-index:1}
.capa h2{font-size:104px;font-weight:900;line-height:1.02;letter-spacing:-.015em;margin:26px 0 30px}
.capa p{margin:0;font-size:38px;line-height:1.3;max-width:900px}
.num{position:absolute;right:30px;top:90px;font:900 560px/1 Montserrat,sans-serif;color:rgba(255,255,255,.12)}
.faixa{position:absolute;right:-120px;bottom:90px;width:760px;height:44px;background:rgba(255,255,255,.14);clip-path:polygon(32px 0,100% 0,100% 100%,0 100%)}
.faixa.b{bottom:150px;right:-60px;width:440px;background:var(--boia)}

/* cartões */
.topo{margin-bottom:34px}
.topo h2{font-size:60px;font-weight:900;line-height:1.08;margin-top:10px}
.cards{display:grid;gap:22px;grid-template-columns:repeat(var(--cols),1fr)}
.card{position:relative;display:block;padding:30px 34px 28px;border-radius:18px;background:#fff;color:var(--ink);text-decoration:none;min-height:150px;box-shadow:0 18px 40px -22px rgba(0,0,0,.6)}
.card::before{content:"";position:absolute;left:0;top:18px;bottom:18px;width:7px;border-radius:0 6px 6px 0;background:linear-gradient(#0163ad,#009857)}
a.card:hover,a.card:focus-visible{outline:5px solid var(--boia)}
.card h3{font-size:31px;font-weight:800;line-height:1.16;color:var(--ink)}
a.card{padding-right:58px}
a.card::after{content:"↗";position:absolute;right:22px;top:24px;font:700 30px/1 Montserrat,sans-serif;color:var(--blue)}
.card p{margin:12px 0 0;font-size:23px;line-height:1.36;color:var(--muted)}
.card .tag{display:block;margin-top:14px;font:700 17px/1.2 Inter,sans-serif;letter-spacing:.07em;text-transform:uppercase;color:#00713f}
.miudo .card{padding:24px 30px 22px}
.miudo .card h3{font-size:28px}
.miudo .card p{font-size:21px}
.card.breve{background:rgba(255,255,255,.1);border:2px dashed rgba(255,255,255,.6);box-shadow:none}
.card.breve::before{display:none}
.card.breve h3,.card.breve p{color:#fff}
.card.breve .tag{color:#ffc9a6}

/* fecho */
.fim{background-image:linear-gradient(90deg,rgba(6,37,58,.94) 40%,rgba(6,37,58,.15) 80%),url(assets/conhecimento.jpg);background-size:auto,230%;background-position:0 0,88% 3%}
.fim .txt{display:flex;flex-direction:column;justify-content:center;height:100%;max-width:860px}
.fim h2{font-size:86px;font-weight:900;line-height:1.05;margin:22px 0 36px}
.fim ul{list-style:none;display:flex;gap:44px;margin:0 0 40px;padding:0}
.fim li{font-size:23px;line-height:1.25}
.fim li b{display:block;font:900 72px/1 Montserrat,sans-serif;color:#ffc9a6;margin-bottom:6px}
.marca{display:flex;align-items:center;gap:20px;font-weight:600}
.marca img{height:62px;padding:6px 10px;border-radius:10px;background:#fff}

/* progresso: a boia nada até a ilha */
#mar{position:absolute;left:0;right:0;bottom:0;height:62px;z-index:20;pointer-events:none}
#mar svg{position:absolute;inset:0;width:100%;height:100%}
#boia{position:absolute;bottom:14px;left:40px;width:38px;height:38px;transition:left .9s cubic-bezier(.3,.8,.3,1)}
#boia svg{animation:balanca 2.6s ease-in-out infinite}
@keyframes balanca{50%{transform:translateY(-5px) rotate(8deg)}}
#auto{position:absolute;left:24px;bottom:66px;z-index:21;padding:6px 16px;border-radius:99px;background:var(--boia);color:#10202a;font:700 18px/1.3 Inter,sans-serif;display:none}
#auto.on{display:block}
#ajuda{position:absolute;left:50%;bottom:72px;z-index:21;transform:translateX(-50%);padding:10px 24px;border-radius:99px;background:rgba(10,24,32,.88);font-size:20px;white-space:nowrap;transition:opacity .6s;pointer-events:none}
#ajuda kbd{font:700 18px/1 Inter,sans-serif;padding:2px 8px;border-radius:5px;background:#fff;color:#10202a}
#ajuda.off{opacity:0}

@media (prefers-reduced-motion:reduce){
  [data-a],.hq img,#contorno,#boia{transition:none}
  .on .mun{animation:none;opacity:.9}
  #boia svg{animation:none}
}
</style>
</head>
<body>
<div id="stage" role="main">
  <div id="wipe"><i></i><i></i></div>
  <div id="mar" aria-hidden="true">
    <svg viewBox="0 0 1600 62" preserveAspectRatio="none">
      <path fill="rgba(255,255,255,.2)" d="M0 30q50-14 100 0t100 0 100 0 100 0 100 0 100 0 100 0 100 0 100 0 100 0 100 0 100 0 100 0 100 0 100 0 100 0V62H0z"/>
      <path fill="#d9b779" d="M1480 62q44-26 120-26V62z"/>
      <path fill="#2fad56" d="M1500 46q14-30 40-28 8-10 24-6 12-4 36 2V40q-50-4-100 6z"/>
    </svg>
    <div id="boia"><svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="14" fill="none" stroke="#f26a21" stroke-width="9"/><circle cx="20" cy="20" r="14" fill="none" stroke="#fff" stroke-width="9" stroke-dasharray="9 13"/></svg></div>
  </div>
  <div id="auto">Automático · A para parar</div>
  <div id="ajuda"><kbd>→</kbd> avança &nbsp; <kbd>←</kbd> volta &nbsp; <kbd>A</kbd> automático &nbsp; <kbd>1</kbd>–<kbd>5</kbd> ambientes &nbsp; <kbd>F</kbd> tela cheia &nbsp; <kbd>Esc</kbd> sai</div>
</div>

<script src="assets/parana.js"></script>
<script src="assets/ecossistema.js"></script>
<script>
(() => {
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const COR = ['#0163ad', '#00713f', '#0f4c75', '#00696b', '#0c4a33'];
  const POR_TELA = 6;
  const stage = document.getElementById('stage');
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const plural = n => `${n} ${n === 1 ? 'item' : 'itens'}`;
  const itensDe = sec => sec.grupos ? sec.grupos.flatMap(g => g.itens) : sec.itens;

  const card = (it, d) => {
    const corpo = `<h3>${esc(it.nome)}</h3>${it.descricao ? `<p>${esc(it.descricao)}</p>` : ''}`;
    const estilo = `data-a="pop" style="--d:${(0.35 + d * 0.13).toFixed(2)}s"`;
    return it.url
      ? `<a class="card" ${estilo} href="${esc(it.url)}" target="_blank" rel="noopener">${corpo}${it.tag ? `<span class="tag">${esc(it.tag)}</span>` : ''}</a>`
      : `<div class="card breve" ${estilo}>${corpo}<span class="tag">${esc(it.tag ? it.tag + ' · em breve' : 'Em breve')}</span></div>`;
  };
  const colunas = n => (n <= 3 ? n : n === 4 ? 2 : 3);
  const telaCards = (kicker, titulo, itens, cor) => ({
    c: cor,
    html: `<div class="topo"><div class="kick" data-a="left">${esc(kicker)}</div>
      <h2 data-a="left" style="--d:.1s">${esc(titulo)}</h2></div>
      <div class="cards${itens.length > 4 ? ' miudo' : ''}" style="--cols:${colunas(itens.length)}">${itens.map(card).join('')}</div>`,
  });
  const fatias = lista => Array.from({ length: Math.ceil(lista.length / POR_TELA) },
    (_, i) => lista.slice(i * POR_TELA, (i + 1) * POR_TELA));

  const ajuda = document.getElementById('ajuda');
  const filme = () => document.getElementById('filme');
  const todos = ECOSSISTEMA.flatMap(itensDe);
  const noAr = todos.filter(i => i.url).length;
  const SLIDES = [];
  const inicioDe = {};

  // 1. a imagem
  SLIDES.push({
    c: '#10202a', passos: 1, tempo: 6000,
    html: `<div class="hq"><img src="assets/conhecimento.jpg" alt="Quadrinho em dois painéis. No primeiro, um professor mostra a alunos um filete de água caindo numa fonte e diz: eis o conhecimento. No segundo, professor e alunos nadam com boias em mar aberto rumo a uma ilha com a placa entendimento e interpretação."></div>`,
  });
  // 2. o vídeo; toca ao entrar e, no modo automático, avança quando termina
  SLIDES.push({
    c: '#000', classe: 'filme', video: true,
    html: `<video id="filme" src="assets/video-camadas-parana.mp4" controls playsinline preload="metadata"></video>`,
    aoEntrar: () => {
      ajuda.classList.add('off');
      filme().play().catch(() => {}); // sem permissão de som, os controles ficam à mão
    },
  });
  // 3. a ponte entre a imagem e o ecossistema
  SLIDES.push({
    c: '#0163ad', passos: 2, tempo: 4000,
    html: `<div class="ponte">
      <p data-a="up">A fonte mostra o <em>conhecimento.</em></p>
      <p data-a="up" data-s="1">O <em>entendimento</em> é uma ilha, e cada um nada até ela.</p>
      <p data-a="up" data-s="2">Este ecossistema é a <em>boia.</em></p></div>
      <svg class="anel" data-a="pop" data-s="2" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="14" fill="none" stroke="#f26a21" stroke-width="9"/><circle cx="20" cy="20" r="14" fill="none" stroke="#fff" stroke-width="9" stroke-dasharray="9 13"/></svg>`,
  });
  // 4. o território
  SLIDES.push({
    c: '#00713f', tempo: 6500,
    html: `<div class="mapa"><div>
        <div class="kick" data-a="left">Departamento de Planejamento</div>
        <h2 data-a="left" style="--d:.1s;margin-top:18px">Do dado à decisão, em todo o Paraná.</h2>
        <div class="n" data-a="up" style="--d:.3s"><span id="cont">0</span><small>municípios atendidos</small></div>
      </div>
      <svg viewBox="0 0 ${PR.w} ${PR.h}" aria-hidden="true"><path id="contorno" pathLength="1" d="${PR.outline}"/>
        ${PR.mun.map(([x, y], i) => `<circle class="mun" cx="${x}" cy="${y}" r="4.4" style="--d:${(1 + i * 0.006).toFixed(3)}s"/>`).join('')}
      </svg></div>`,
    aoEntrar: () => contar(document.getElementById('cont'), PR.mun.length, 1000, PR.mun.length * 6),
  });
  // 5. os ambientes
  SLIDES.push({
    c: '#10303f', tempo: 7000,
    html: `<div class="visao"><div class="kick" data-a="left">Reunidos em um só lugar</div>
      <h2 data-a="left" style="--d:.08s">${ECOSSISTEMA.length} ambientes, ${todos.length} itens</h2>
      ${ECOSSISTEMA.map((s, i) => `<button class="linha" data-a="left" data-ir="${esc(s.id)}" style="--c2:${COR[i % COR.length]};--d:${(0.2 + i * 0.12).toFixed(2)}s">
        <b>${i + 1}</b><span>${esc(s.titulo)}</span><i>${plural(itensDe(s).length)}</i></button>`).join('')}</div>`,
  });
  // 6. um bloco por ambiente, gerado de assets/ecossistema.js
  ECOSSISTEMA.forEach((sec, i) => {
    const cor = COR[i % COR.length];
    inicioDe[sec.id] = SLIDES.length;
    SLIDES.push({
      c: cor, tempo: 4000,
      html: `<div class="num" data-a="right" aria-hidden="true">${i + 1}</div><div class="faixa" data-a="right" style="--d:.15s"></div><div class="faixa b" data-a="right" style="--d:.25s"></div>
        <div class="capa"><div class="rule" data-a="left"></div>
        <h2 data-a="left" style="--d:.1s">${esc(sec.titulo)}</h2><p data-a="up" style="--d:.3s">${esc(sec.sub)}</p></div>`,
    });
    const kicker = sec.grupos ? sec.menu || sec.titulo : `Ambiente ${i + 1}`;
    const blocos = sec.grupos ? sec.grupos.map(g => [g.titulo, g.itens]) : [[sec.titulo, sec.itens]];
    blocos.forEach(([titulo, itens]) => fatias(itens).forEach(parte => SLIDES.push(telaCards(kicker, titulo, parte, cor))));
  });
  // 7. a ilha
  SLIDES.push({
    c: '#06253a', classe: 'fim', tempo: 9000,
    html: `<div class="txt"><div class="rule" data-a="left"></div>
      <h2 data-a="left" style="--d:.1s">Do dado à decisão, em todo o Paraná.</h2>
      <ul>
        <li data-a="up" style="--d:.3s"><b>${PR.mun.length}</b>municípios</li>
        <li data-a="up" style="--d:.42s"><b>${ECOSSISTEMA.length}</b>ambientes</li>
        <li data-a="up" style="--d:.54s"><b>${noAr}</b>itens no ar</li>
        <li data-a="up" style="--d:.66s"><b>${todos.length - noAr}</b>em breve</li>
      </ul>
      <div class="marca" data-a="up" style="--d:.8s"><img src="assets/logo-idr.webp" alt="IDR-Paraná"><span>Departamento de Planejamento<br>planejamento-idrparana.github.io</span></div></div>`,
  });

  stage.insertAdjacentHTML('afterbegin', SLIDES.map(s => `<section class="slide ${s.classe || ''}" style="--c:${s.c}">${s.html}</section>`).join(''));
  const els = [...stage.querySelectorAll('.slide')];

  let contagem = 0;
  function contar(el, total, atraso, duracao) {
    cancelAnimationFrame(contagem);
    if (reduce) { el.textContent = total; return; }
    const t0 = performance.now() + atraso;
    const passo = t => {
      const f = Math.max(0, Math.min(1, (t - t0) / duracao));
      el.textContent = Math.round(f * total);
      if (f < 1) contagem = requestAnimationFrame(passo);
    };
    contagem = requestAnimationFrame(passo);
  }

  let i = -1, s = 0, trocaT = 0;
  const pinta = () => {
    const el = els[i];
    el.dataset.step = s;
    el.querySelectorAll('[data-a]').forEach(a => a.classList.toggle('in', s >= +(a.dataset.s || 0)));
    agenda();
  };
  const mostra = alvo => {
    els.forEach(e => {
      e.classList.remove('on');
      e.querySelectorAll('[data-a]').forEach(a => a.classList.remove('in'));
    });
    if (!filme().paused || filme().currentTime) { filme().pause(); filme().currentTime = 0; }
    document.getElementById('mar').hidden = !!SLIDES[alvo].video;
    const el = els[alvo];
    el.classList.add('on');
    document.documentElement.style.setProperty('--bg', SLIDES[alvo].c);
    el.getBoundingClientRect(); // garante a transição a partir do estado oculto
    pinta();
    if (SLIDES[alvo].aoEntrar) SLIDES[alvo].aoEntrar();
    document.getElementById('boia').style.left = `${40 + (alvo / (els.length - 1)) * 1440}px`;
  };
  const vai = (alvo, passo = 0) => {
    if (alvo < 0 || alvo >= els.length) return;
    i = alvo; s = passo;
    clearTimeout(trocaT);
    if (reduce) return mostra(alvo);
    const w = document.getElementById('wipe');
    w.classList.remove('go'); w.getBoundingClientRect(); w.classList.add('go');
    trocaT = setTimeout(() => mostra(alvo), 400);
  };
  const avanca = () => (s < (SLIDES[i].passos || 0) ? (s++, pinta()) : vai(i + 1));
  const volta = () => (s > 0 ? (s--, pinta()) : vai(i - 1, SLIDES[i - 1] ? SLIDES[i - 1].passos || 0 : 0));

  // modo automático: o tempo de cada tela vem do volume de texto
  let auto = false, autoT = 0;
  const duracao = () => SLIDES[i].tempo || Math.min(16000, Math.max(5000, els[i].textContent.length * 50));
  function agenda() {
    clearTimeout(autoT);
    if (!auto) return;
    if (i === els.length - 1) return alternaAuto();
    if (SLIDES[i].video) return; // o fim do vídeo é quem avança
    autoT = setTimeout(avanca, duracao());
  }
  function alternaAuto() {
    auto = !auto;
    document.getElementById('auto').classList.toggle('on', auto);
    agenda();
  }

  const telaCheia = () => (document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen());
  const TECLAS = {
    ArrowRight: avanca, ArrowDown: avanca, PageDown: avanca,
    ' ': () => (SLIDES[i].video ? (filme().paused ? filme().play() : filme().pause()) : avanca()),
    ArrowLeft: volta, ArrowUp: volta, PageUp: volta,
    Home: () => vai(0), End: () => vai(els.length - 1),
    a: alternaAuto, f: telaCheia, h: () => ajuda.classList.toggle('off'),
    Escape: () => { location.href = 'index.html'; },
  };
  addEventListener('keydown', e => {
    if (e.altKey || e.ctrlKey || e.metaKey) return;
    const sec = /^[1-9]$/.test(e.key) && ECOSSISTEMA[+e.key - 1];
    if (sec) return vai(inicioDe[sec.id]);
    const fn = TECLAS[e.key.length === 1 ? e.key.toLowerCase() : e.key];
    if (!fn) return;
    e.preventDefault();
    if (e.repeat) return;
    fn();
  });
  // toque ou clique: esquerda volta, o resto avança; links e botões seguem o próprio caminho
  stage.addEventListener('click', e => {
    const ir = e.target.closest('[data-ir]');
    if (ir) return vai(inicioDe[ir.dataset.ir]);
    if (e.target.closest('a, video')) return;
    const r = stage.getBoundingClientRect();
    return (e.clientX - r.left) / r.width < 0.25 ? volta() : avanca();
  });

  filme().addEventListener('ended', () => { if (auto) avanca(); });

  const ajusta = () => { stage.style.transform = `scale(${Math.min(innerWidth / 1600, innerHeight / 900)})`; };
  addEventListener('resize', ajusta);
  ajusta();
  setTimeout(() => ajuda.classList.add('off'), 7000);
  i = 0; mostra(0);
})();
</script>
</body>
</html>
