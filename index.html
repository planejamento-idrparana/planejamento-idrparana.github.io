<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DEPLAN · IDR-Paraná</title>
<meta name="description" content="Ecossistema de dados, painéis e publicações do Departamento de Planejamento do IDR-Paraná.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f4ee; --ink:#14231b; --muted:#5b6b61; --line:#d9d5c8;
  --land:#e7eadf; --dot:#2f6b4a; --accent:#c8862a; --card:#fffdf8;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1612; --ink:#e9efe9; --muted:#9aaba0; --line:#25332b;
    --land:#15211b; --dot:#6fbf8e; --accent:#e3a548; --card:#131e18;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1612; --ink:#e9efe9; --muted:#9aaba0; --line:#25332b;
  --land:#15211b; --dot:#6fbf8e; --accent:#e3a548; --card:#131e18;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 Inter,system-ui,sans-serif}
a{color:inherit}
.wrap{max-width:72rem;margin:0 auto;padding:0 16px}
header.top{display:flex;justify-content:space-between;align-items:center;padding:20px 0;font-weight:600;letter-spacing:.02em}
header.top nav a{margin-left:1.25rem;text-decoration:none;color:var(--muted);font-weight:500}
header.top nav a:hover{color:var(--ink)}

.hero{display:grid;grid-template-columns:1fr 1.25fr;gap:2rem;align-items:center;min-height:calc(100svh - 72px)}
.kicker{color:var(--accent);font-weight:600;text-transform:uppercase;letter-spacing:.12em;font-size:.8rem}
h1{font-family:Fraunces,Georgia,serif;font-weight:700;font-size:clamp(2.4rem,5vw,4.2rem);line-height:1.05;margin:.4rem 0 1rem}
.lead{color:var(--muted);font-size:1.1rem;max-width:32rem}
.count{font-family:Fraunces,Georgia,serif;font-size:clamp(3rem,6vw,5rem);line-height:1;color:var(--dot);margin-top:2rem}
.count small{display:block;font-family:Inter,sans-serif;font-size:.9rem;color:var(--muted);letter-spacing:.04em}

.map{position:relative}
.map svg{width:100%;height:auto;display:block;overflow:visible}
#outline{fill:var(--land);stroke:var(--dot);stroke-width:1.5;stroke-linejoin:round}
.mun{fill:var(--dot);opacity:0;transform-box:fill-box;transform-origin:center}
.mun.on{animation:pop .5s ease-out forwards}
.mun:hover{fill:var(--accent)}
@keyframes pop{0%{opacity:0;transform:scale(0)}70%{opacity:1;transform:scale(1.8)}100%{opacity:.85;transform:scale(1)}}
#tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font-size:.8rem;padding:2px 8px;border-radius:4px;white-space:nowrap;opacity:0;transform:translate(-50%,-140%);transition:opacity .15s}

section.eco{padding:5rem 0;border-top:1px solid var(--line)}
section.eco h2{font-family:Fraunces,Georgia,serif;font-size:2rem;margin:0 0 .25rem}
section.eco p.sub{color:var(--muted);margin:0 0 2rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(16rem,1fr));gap:1rem}
.card{display:block;text-decoration:none;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:1.25rem;transition:transform .2s,border-color .2s}
.card:hover{transform:translateY(-3px);border-color:var(--dot)}
.card h3{margin:0 0 .35rem;font-size:1.05rem}
.card p{margin:0;color:var(--muted);font-size:.92rem}
.card .tag{display:inline-block;margin-top:.8rem;font-size:.75rem;color:var(--accent);font-weight:600}
.empty{color:var(--muted);font-style:italic}
.reveal{opacity:0;transform:translateY(24px);transition:opacity .7s,transform .7s}
.reveal.in{opacity:1;transform:none}

footer{padding:3rem 0;color:var(--muted);font-size:.85rem;border-top:1px solid var(--line)}

@media (max-width:760px){
  .hero{grid-template-columns:1fr;min-height:auto;padding:1rem 0 3rem}
  .map{order:-1}
  header.top nav{display:none}
}
@media (prefers-reduced-motion:reduce){
  .mun{opacity:.85}.mun.on{animation:none}
  .reveal{opacity:1;transform:none;transition:none}
  html{scroll-behavior:auto}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <span>DEPLAN · IDR-Paraná</span>
    <nav id="nav"></nav>
  </header>

  <main>
    <section class="hero">
      <div>
        <div class="kicker">Departamento de Planejamento</div>
        <h1>Do dado à decisão, em todo o Paraná.</h1>
        <p class="lead">Realidade rural, monitoramento, planejamento e ferramentas técnicas do DEPLAN reunidos em um só lugar.</p>
        <div class="count"><span id="n">0</span><small>municípios atendidos</small></div>
      </div>
      <div class="map" aria-hidden="true">
        <svg id="pr"><path id="outline"/></svg>
        <div id="tip"></div>
      </div>
    </section>
    <div id="secoes"></div>
  </main>

  <footer>
    Departamento de Planejamento ·
    <a href="https://www.idrparana.pr.gov.br" target="_blank" rel="noopener">IDR-Paraná</a> ·
    <a href="https://www.agricultura.pr.gov.br" target="_blank" rel="noopener">SEAB</a>
  </footer>
</div>

<script src="assets/parana.js"></script>
<script src="assets/ecossistema.js"></script>
<script>
(() => {
  const NS = 'http://www.w3.org/2000/svg';
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const svg = document.getElementById('pr'), tip = document.getElementById('tip');
  svg.setAttribute('viewBox', `0 0 ${PR.w} ${PR.h}`);
  const outline = document.getElementById('outline');
  outline.setAttribute('d', PR.outline);

  // contorno se desenha, depois os municípios acendem de oeste para leste
  if (!reduce) {
    const len = outline.getTotalLength();
    outline.style.strokeDasharray = len;
    outline.style.strokeDashoffset = len;
    outline.style.fillOpacity = 0;
    outline.getBoundingClientRect();
    outline.style.transition = 'stroke-dashoffset 1.8s ease-in-out, fill-opacity 1s 1.4s';
    outline.style.strokeDashoffset = 0;
    outline.style.fillOpacity = 1;
  }
  const n = document.getElementById('n');
  PR.mun.forEach(([x, y, nome], i) => {
    const c = document.createElementNS(NS, 'circle');
    c.dataset.nome = nome;
    c.setAttribute('cx', x); c.setAttribute('cy', y); c.setAttribute('r', 4.2);
    c.setAttribute('class', 'mun');
    svg.appendChild(c);
    setTimeout(() => { c.classList.add('on'); n.textContent = i + 1; }, reduce ? 0 : 1500 + i * 6);
  });
  svg.addEventListener('pointerover', e => {
    if (!e.target.dataset.nome) return;
    const r = svg.getBoundingClientRect(), b = e.target.getBoundingClientRect();
    tip.textContent = e.target.dataset.nome;
    tip.style.left = (b.left + b.width / 2 - r.left) + 'px';
    tip.style.top = (b.top - r.top) + 'px';
    tip.style.opacity = 1;
  });
  svg.addEventListener('pointerout', () => tip.style.opacity = 0);

  // seções do ecossistema a partir de assets/ecossistema.js
  const esc = s => String(s).replace(/[&<>"]/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch]));
  const host = document.getElementById('secoes'), nav = document.getElementById('nav');
  ECOSSISTEMA.forEach(sec => {
    nav.insertAdjacentHTML('beforeend', `<a href="#${esc(sec.id)}">${esc(sec.titulo)}</a>`);
    const cards = sec.itens.length
      ? sec.itens.map(it => `<a class="card reveal" href="${esc(it.url)}" target="_blank" rel="noopener">
          <h3>${esc(it.nome)}</h3><p>${esc(it.descricao)}</p>${it.tag ? `<span class="tag">${esc(it.tag)}</span>` : ''}</a>`).join('')
      : '<p class="empty">Conteúdo em curadoria.</p>';
    host.insertAdjacentHTML('beforeend', `<section class="eco" id="${esc(sec.id)}">
      <h2 class="reveal">${esc(sec.titulo)}</h2><p class="sub reveal">${esc(sec.sub)}</p><div class="grid">${cards}</div></section>`);
  });
  const io = new IntersectionObserver(es => es.forEach(e => {
    if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); }
  }), { threshold: .15 });
  document.querySelectorAll('.reveal').forEach((el, i) => { el.style.transitionDelay = (i % 4) * 80 + 'ms'; io.observe(el); });
})();
</script>
</body>
</html>
