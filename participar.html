<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Sua opinião sobre o IDR-Paraná</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f9f7;--ink:#2b373e;--muted:#5d6b73;--line:#c9d6d0;--forte:#00713f;--fraco:#b5480f;--azul:#0163ad}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 Inter,system-ui,sans-serif}
main{max-width:30rem;margin:0 auto;padding:20px 16px 40px}
img{height:46px;display:block}
h1{font:800 1.75rem/1.15 Montserrat,sans-serif;margin:20px 0 8px}
p{margin:0 0 20px;color:var(--muted)}
form{display:grid;gap:18px}
label{display:block;font:700 1.05rem/1.3 Montserrat,sans-serif;margin-bottom:6px}
#l-forte{color:var(--forte)}
#l-fraco{color:var(--fraco)}
input{width:100%;padding:14px;font:inherit;font-size:18px;color:var(--ink);background:#fff;border:2px solid var(--line);border-radius:10px}
input:focus{outline:3px solid var(--azul);outline-offset:1px}
button{padding:15px;font:700 1.05rem Montserrat,sans-serif;color:#fff;background:var(--azul);border:0;border-radius:10px;cursor:pointer}
button:disabled{opacity:.6}
small{display:block;color:var(--muted);font-size:.88rem}
#msg{font-weight:600;color:var(--fraco);min-height:1.5em;margin:0}
#fim h1{color:var(--forte)}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
  <img src="assets/logo-idr.webp" alt="IDR-Paraná" width="161" height="46">
  <div id="corpo">
    <h1>Como você vê o IDR-Paraná?</h1>
    <p>Responda em até três palavras. As respostas vão para a tela da apresentação.</p>
    <form id="f" novalidate>
      <div><label id="l-forte" for="forte">Um ponto forte do IDR</label>
        <input id="forte" name="forte" maxlength="40" autocomplete="off" required></div>
      <div><label id="l-fraco" for="fraco">Um ponto fraco do IDR</label>
        <input id="fraco" name="fraco" maxlength="40" autocomplete="off" required></div>
      <small>Sua resposta é anônima e aparece para todos. Não escreva nomes de pessoas nem dados pessoais.</small>
      <button id="b">Enviar</button>
      <p id="msg" role="alert"></p>
    </form>
  </div>
  <div id="fim" hidden>
    <h1>Obrigado!</h1>
    <p>Sua resposta foi registrada. Agora é só olhar para a tela da apresentação.</p>
  </div>
</main>
<script src="assets/dinamica.js"></script>
<script>
(() => {
  const param = new URLSearchParams(location.search).get('s');
  const sessao = /^\d{4}-\d{2}-\d{2}$/.test(param || '') ? param : DINAMICA.hoje();
  const chave = `dinamica-${sessao}`;
  const le = () => { try { return localStorage.getItem(chave); } catch { return null; } };
  const grava = () => { try { localStorage.setItem(chave, '1'); } catch { /* sem armazenamento, só perde o aviso de já respondido */ } };
  const $ = id => document.getElementById(id);
  const concluir = () => { $('corpo').hidden = true; $('fim').hidden = false; };
  if (le()) concluir();

  $('f').addEventListener('submit', async e => {
    e.preventDefault();
    const forte = $('forte').value.trim(), fraco = $('fraco').value.trim();
    if (forte.length < 2 || fraco.length < 2) {
      $('msg').textContent = 'Preencha os dois campos.';
      (forte.length < 2 ? $('forte') : $('fraco')).focus();
      return;
    }
    $('b').disabled = true;
    $('msg').textContent = '';
    try {
      const r = await fetch(DINAMICA.rest, {
        method: 'POST',
        headers: { ...DINAMICA.cabecalho, 'Content-Type': 'application/json', Prefer: 'return=minimal' },
        body: JSON.stringify({ sessao, forte, fraco }),
      });
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      grava();
      concluir();
    } catch {
      $('msg').textContent = 'Não foi possível enviar. Confira sua conexão e tente de novo.';
      $('b').disabled = false;
    }
  });
})();
</script>
</body>
</html>
